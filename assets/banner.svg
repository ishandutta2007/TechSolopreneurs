<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Particle Glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #CBD5E1;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #A7F3D0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    
    /* Animations */
    @keyframes floatOne {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    @keyframes floatTwo {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-3deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }

    .node-1 { animation: floatOne 6s ease-in-out infinite; }
    .node-2 { animation: floatTwo 7s ease-in-out infinite; }
    .glow-orb-1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 150px 80px; }
    .glow-orb-2 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 680px 160px; }
    .circuit-line {
      stroke: #4F46E5;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      opacity: 0.35;
      animation: dashLine 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="240" rx="16" class="bg"/>

  <!-- Grid Lines -->
  <path d="M 0 40 L 800 40 M 0 80 L 800 80 M 0 120 L 800 120 M 0 160 L 800 160 M 0 200 L 800 200" stroke="#334155" stroke-width="1" opacity="0.15"/>
  <path d="M 100 0 L 100 240 M 200 0 L 200 240 M 300 0 L 300 240 M 400 0 L 400 240 M 500 0 L 500 240 M 600 0 L 600 240 M 700 0 L 700 240" stroke="#334155" stroke-width="1" opacity="0.15"/>

  <!-- Dynamic Glowing Orbs in Background (behind text) -->
  <circle cx="150" cy="70" r="90" fill="#6366F1" opacity="0.25" class="glow-orb-1" filter="url(#softGlow)"/>
  <circle cx="680" cy="170" r="100" fill="#EC4899" opacity="0.2" class="glow-orb-2" filter="url(#softGlow)"/>

  <!-- Animated Circuit Connecting Lines (behind text) -->
  <path d="M 60 180 Q 180 220 300 180 T 600 200 T 740 120" class="circuit-line" fill="none"/>
  <path d="M 40 60 Q 200 20 400 50 T 760 40" class="circuit-line" fill="none"/>

  <!-- Floating Background Decorative Tech Nodes (positioned far from text center) -->
  <g class="node-1">
    <circle cx="80" cy="80" r="24" fill="#1E1B4B" stroke="#6366F1" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="85" font-size="16" text-anchor="middle" fill="#818CF8">💰</text>
  </g>

  <g class="node-2">
    <circle cx="720" cy="75" r="26" fill="#31103F" stroke="#EC4899" stroke-width="2" filter="url(#glow)"/>
    <text x="720" y="81" font-size="16" text-anchor="middle" fill="#F472B6">🚀</text>
  </g>

  <g class="node-1">
    <circle cx="700" cy="180" r="20" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="700" y="185" font-size="13" text-anchor="middle" fill="#34D399">⚡</text>
  </g>

  <!-- Foreground Content (Guaranteed Unobscured) -->
  <g transform="translate(130, 42)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#064E3B" stroke="#059669" stroke-width="1.2" opacity="0.9"/>
    <text x="15" y="17" class="badge-text">⚡ 100% SOLO • MICRO-SAAS • OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title" filter="url(#glow)">TechSolopreneurs</text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle">High-Profit Solo Software Ventures, MicroSaaS &amp; Open-Source Creators</text>

    <!-- Stat Highlights Row -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="10" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">📈 40+ Founders</text>

      <rect x="140" y="0" width="145" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="150" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">💎 $100M+ Total ARR</text>

      <rect x="295" y="0" width="130" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="305" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">🔥 85%-100% Margin</text>
    </g>
  </g>
</svg>
